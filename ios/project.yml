name: QuotaWatch
options:
  bundleIdPrefix: io.quotawatch
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"

targets:
  QuotaWatch:
    type: application
    platform: iOS
    sources:
      - path: QuotaWatch
    dependencies:
      # Embeds the widget extension into the app bundle.
      - target: QuotaWatchWidgets
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    # Explicit shared scheme — without it `xcodebuild -scheme QuotaWatch`
    # resolves an implicit scheme whose buildables have empty platforms, and
    # every -destination (including the connected iPhone) fails to resolve.
    scheme:
      testTargets: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(QW_APP_ID)
        INFOPLIST_FILE: QuotaWatch/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: QuotaWatch/QuotaWatch.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        # Set your own Apple Developer team to run on a device — either put your
        # team id here (DEVELOPMENT_TEAM: XXXXXXXXXX) or pick it in Xcode's
        # Signing & Capabilities tab after `xcodegen generate`. The App Group +
        # widget extension require a paid Apple Developer account to provision.

  QuotaWatchWidgets:
    type: app-extension
    platform: iOS
    sources:
      # Widget-only code.
      - path: QuotaWatchWidgets
      # Files shared with the app, compiled into the extension too (value types
      # + pure SwiftUI views — no app-only dependencies).
      - path: QuotaWatch/SharedStore.swift
      - path: QuotaWatch/Models.swift
      - path: QuotaWatch/Formatting.swift
      - path: QuotaWatch/Theme.swift
      - path: QuotaWatch/ProviderStyle.swift
      - path: QuotaWatch/RingGauge.swift
      - path: QuotaWatch/APIClient.swift
      - path: QuotaWatch/DemoData.swift
      # Bundled resources the widget needs (brand fonts + brand icons).
      - path: QuotaWatch/Fonts
      - path: QuotaWatch/Assets.xcassets
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(QW_APP_ID).widgets
        INFOPLIST_FILE: QuotaWatchWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: QuotaWatchWidgets/QuotaWatchWidgets.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
